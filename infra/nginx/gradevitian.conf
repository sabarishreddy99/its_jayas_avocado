# gradeVITian — gradevitian.jayaremala.com
#
# Serves the gradeVITian student-tools app from the shared Next.js static export
# (frontend/out/) that CI rsyncs to /var/www/gv-site on this Lightsail box.
#
# The app lives under the `gradevitian/` route segment, but on the subdomain the
# visitor sees clean URLs (/gpa, /login). This vhost maps those clean paths into
# the gradevitian subtree, while the shared /_next/ chunks resolve from the export
# root. The portfolio's own routes are NOT exposed here (they 404).
#
# Install:
#   sudo cp infra/nginx/gradevitian.conf /etc/nginx/sites-available/gradevitian.jayaremala.com
#   sudo ln -s /etc/nginx/sites-available/gradevitian.jayaremala.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gradevitian.jayaremala.com   # adds the 443 block + HTTP→HTTPS redirect
#
# NOTE: certbot rewrites this file in place on the server. If you re-copy it after
# TLS is set up, re-run the certbot command above (it is idempotent) so the 443
# server block and the HTTP→HTTPS redirect come back.
#
# Once on 443, add HSTS to the certbot-generated block:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 80;
    listen [::]:80;
    server_name gradevitian.jayaremala.com;

    root /var/www/gv-site;          # full Next static export (frontend/out/)

    # Smaller HTML/JS/CSS over the wire — LCP is a ranking input, and the export
    # ships uncompressed. (brotli isn't in stock nginx; gzip is the safe baseline.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json application/rss+xml
        image/svg+xml font/woff font/woff2;

    # nginx's add_header does NOT merge: a location with its own add_header drops
    # every header inherited from here. So these two are set once at server level,
    # and the one location below that needs its own add_header repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Shared Next.js build chunks (referenced as /_next/...)
    location /_next/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The 1200x630 social card. Next's opengraph-image route exports without a file
    # extension, so nginx would otherwise label a PNG application/octet-stream and
    # every scraper (X, LinkedIn, Slack, WhatsApp) would refuse to render it.
    location = /gradevitian/opengraph-image {
        default_type image/png;
        try_files $uri =404;
        expires 30d;          # -> Cache-Control: max-age=2592000
    }

    # gradeVITian public assets + PWA manifest (referenced as /gradevitian/...)
    location /gradevitian/ {
        try_files $uri $uri/ =404;
    }

    # Crawler-facing files live in the export at /gradevitian/… but MUST answer at
    # the subdomain root — Google only reads robots.txt from the origin root, and a
    # sitemap can only list URLs at or below its own path.
    location = /robots.txt  { try_files /gradevitian/robots.txt  =404; }
    location = /sitemap.xml { try_files /gradevitian/sitemap.xml =404; }
    location = /manifest.webmanifest { try_files /gradevitian/manifest.webmanifest =404; }
    location = /sw.js {
        try_files /gradevitian/sw.js =404;
        expires -1;           # -> Cache-Control: no-cache (never pin a stale SW)
    }

    # A few root-level files Next references at "/"
    location = /icon.png    { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }

    # Home → the gradeVITian landing page
    location = / {
        expires 0;            # -> Cache-Control: max-age=0 (revalidate every load)
        try_files /gradevitian/index.html =404;
    }

    # All other page routes → the gradeVITian subtree (clean URLs on the subdomain).
    # trailingSlash:true means every page is exported as <route>/index.html.
    location / {
        # One canonical URL per page: /gpa and /gpa/ both used to return 200 with
        # identical HTML, which splits crawl budget and link signals. Extension-less
        # paths now 301 to the trailing-slash form the sitemap and <link rel=canonical>
        # both point at.
        if ($request_uri ~ ^([^.?]*[^/])(\?.*)?$) {
            return 301 $1/$2;
        }

        # HTML is rewritten on every deploy — revalidate rather than serve stale.
        expires 0;            # -> Cache-Control: max-age=0
        try_files /gradevitian$uri/index.html /gradevitian$uri =404;
    }

    # Unknown routes get the app's own 404 page (with its links back into every
    # tool) instead of nginx's bare one. nginx still sends a real 404 status, so
    # this is not a soft 404. The body is the exported /404/ route — a static
    # export has no server, so the segment's not-found.tsx never reaches out/.
    error_page 404 /gradevitian/404/index.html;
    location = /gradevitian/404/index.html {
        internal;
    }
}
