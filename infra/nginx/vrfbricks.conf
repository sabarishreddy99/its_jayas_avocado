# VRF Bricks — vrfbricks.jayaremala.com
#
# Serves Venkata Ramana Fly Ash Cement Bricks from the shared Next.js static
# export (frontend/out/) that CI rsyncs to /var/www/gv-site on this Lightsail
# box. Same export, same box, same rsync as gradeVITian — only the vhost differs.
#
# The app lives under the `vrfbricks/` route segment, but on the subdomain the
# visitor sees clean URLs (/bricks, /visit). This vhost maps those clean paths
# into the vrfbricks subtree, while the shared /_next/ chunks resolve from the
# export root. The portfolio's and gradeVITian's routes are NOT exposed here.
#
# Install:
#   sudo cp infra/nginx/vrfbricks.conf /etc/nginx/sites-available/vrfbricks.jayaremala.com
#   sudo ln -s /etc/nginx/sites-available/vrfbricks.jayaremala.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vrfbricks.jayaremala.com   # adds the 443 block + HTTP→HTTPS redirect
#
# DNS: add an A record for `vrfbricks` pointing at the same Lightsail static IP
# as `gradevitian`, and wait for it to resolve BEFORE running certbot.
#
# NOTE: certbot rewrites this file in place on the server. If you re-copy it
# after TLS is set up, re-run the certbot command above (it is idempotent) so
# the 443 server block and the HTTP→HTTPS redirect come back.
#
# Once on 443, add HSTS to the certbot-generated block:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

server {
    listen 80;
    listen [::]:80;
    server_name vrfbricks.jayaremala.com;

    root /var/www/gv-site;          # full Next static export (frontend/out/)

    # This site's audience is on mobile data in coastal Andhra Pradesh, so the
    # wire size matters more here than anywhere else on the box.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json application/rss+xml
        image/svg+xml font/woff font/woff2;

    # nginx's add_header does NOT merge: a location with its own add_header
    # drops every header inherited from here. So these are set once at server
    # level, and any location below that needs its own add_header repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Shared Next.js build chunks (referenced as /_next/...)
    location /_next/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The 1200x630 social card. Next's opengraph-image route exports without a
    # file extension, so nginx would otherwise label a PNG as
    # application/octet-stream and every scraper — WhatsApp above all, which is
    # how this business actually gets shared — would refuse to render it.
    location = /vrfbricks/opengraph-image {
        default_type image/png;
        try_files $uri =404;
        expires 30d;          # -> Cache-Control: max-age=2592000
    }

    # Photographs and any other VRF public assets (referenced as /vrfbricks/...).
    # These are content-hashed by nothing, so keep the window short enough that
    # replacing a photo actually reaches people.
    location /vrfbricks/ {
        try_files $uri $uri/ =404;
        expires 7d;
    }

    # Crawler-facing files live in the export at /vrfbricks/… but MUST answer at
    # the subdomain root — Google only reads robots.txt from the origin root, and
    # a sitemap can only list URLs at or below its own path.
    location = /robots.txt  { try_files /vrfbricks/robots.txt  =404; }
    location = /sitemap.xml { try_files /vrfbricks/sitemap.xml =404; }

    # A few root-level files Next references at "/"
    location = /icon.png    { try_files $uri =404; }
    location = /favicon.ico { try_files $uri =404; }

    # Home → the VRF Bricks landing page
    location = / {
        expires 0;            # -> Cache-Control: max-age=0 (revalidate every load)
        try_files /vrfbricks/index.html =404;
    }

    # All other page routes → the vrfbricks subtree (clean URLs on the subdomain).
    # trailingSlash:true means every page is exported as <route>/index.html.
    location / {
        # One canonical URL per page: /bricks and /bricks/ would otherwise both
        # return 200 with identical HTML, splitting crawl budget and link
        # signals. Extension-less paths 301 to the trailing-slash form that the
        # sitemap and <link rel=canonical> both point at.
        if ($request_uri ~ ^([^.?]*[^/])(\?.*)?$) {
            return 301 $1/$2;
        }

        # HTML is rewritten on every deploy — revalidate rather than serve stale.
        expires 0;            # -> Cache-Control: max-age=0
        try_files /vrfbricks$uri/index.html /vrfbricks$uri =404;
    }

    # Unknown routes get the site's own 404 page — which still carries the phone
    # number — instead of nginx's bare one. nginx still sends a real 404 status,
    # so this is not a soft 404. The body is the exported /404/ route: a static
    # export has no server, so the segment's not-found.tsx never reaches out/.
    error_page 404 /vrfbricks/404/index.html;
    location = /vrfbricks/404/index.html {
        internal;
    }
}
