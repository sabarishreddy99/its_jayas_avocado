# Local development stack. Production is deployed by .github/workflows/deploy.yml:
#   backend  -> image built from backend/Dockerfile, pushed to GHCR, rolled out
#               onto Lightsail by infra/scripts/deploy.sh
#   frontend -> static export uploaded to GitHub Pages + rsynced to Lightsail
#
# Each service builds from the Dockerfile that lives beside it, so the image
# compose builds here is the same one CI builds. Run from the repo root:
#   docker compose -f infra/compose.yml up --build

services:
  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    # Mount source and data over the baked-in copies so --reload picks up edits.
    # backend/Dockerfile sets WORKDIR /app and copies to /app/src and /app/data.
    volumes:
      - ../backend/src:/app/src
      - ../backend/data:/app/data
    command: >
      python -m uvicorn app.main:app
      --app-dir src
      --host 0.0.0.0
      --port 8000
      --reload

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      # Anonymous volume keeps the image's node_modules from being shadowed by
      # the bind mount above (the host may have none, or a wrong-platform one).
      - /app/node_modules
    depends_on:
      - backend
